name: app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: App version name
        required: true
        type: string
      version_code:
        description: Increasing app version code
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lint
      - uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: app/build/outputs/apk/
          retention-days: 7

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    concurrency:
      group: app-release
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version and existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]]
          test "$VERSION_CODE" -gt 1801
          previous=$(gh release list --limit 1000 --exclude-drafts --json tagName --jq '[.[].tagName | select(startswith("app-")) | sub("^app-"; "") | tonumber] | max // 1801')
          test "$VERSION_CODE" -gt "$previous"
      - name: Build candidate release
        run: ./gradlew :app:assembleRelease -Pherald.versionName="$VERSION_NAME" -Pherald.versionCode="$VERSION_CODE"
      - name: Sign and verify
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          umask 077
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          trap 'rm -f "$keystore"' EXIT
          mkdir -p release
          signer="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          KS_PASS="$STORE_PASSWORD" KEY_PASS="$KEY_PASSWORD" "$signer" sign \
            --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --v4-signing-enabled false \
            --out "release/product-$VERSION_NAME.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          ./gradlew verifySignedApk -Papk.path="release/product-$VERSION_NAME.apk" \
            -Pherald.versionCode="$VERSION_CODE"
          "$signer" verify --print-certs "release/product-$VERSION_NAME.apk" \
            | grep 'certificate SHA-256 digest:' > release/SIGNING-CERTIFICATE.txt
          (cd release && sha256sum ./*.apk > SHA256SUMS)
      - name: Publish release from reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "app-$VERSION_CODE" release/* --target "$GITHUB_SHA" \
            --title "App $VERSION_NAME" --generate-notes
